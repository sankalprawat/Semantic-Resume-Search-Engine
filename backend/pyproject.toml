[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-engine-backend"
version = "0.1.0"
description = "Multi-Candidate Semantic Talent Engine - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Talent Engine Team" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B008"]  # Allow FastAPI Depends() in function parameters
