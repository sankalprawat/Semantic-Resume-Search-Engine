<svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Network Gradient -->
    <linearGradient id="fav_back_grad" x1="4.4" y1="6.6" x2="192.4" y2="206.6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Base Paper Gradient -->
    <linearGradient id="fav_paper_grad" x1="0.5" y1="0.5" x2="108.5" y2="164.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Dog-Ear Fold Gradient -->
    <linearGradient id="fav_fold_grad" x1="88" y1="20" x2="108" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Foreground Network Gradient -->
    <linearGradient id="fav_fore_grad" x1="1.8" y1="3.76" x2="185.8" y2="203.47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Paper Clip Mask -->
    <clipPath id="fav_paper_clip">
      <path d="M5 0H88L108 20V159C108 161.761 106.261 164 103 164H5C2.2386 164 0 161.761 0 159V5C0 2.2386 2.2386 0 5 0Z" />
    </clipPath>
  </defs>

  <!-- 1. Background Neural Network Cage -->
  <g id="Neural_Network_Back" transform="translate(22.2, 14)">
    <path d="M96.4 4.6L14.4 50.6L4.4 108.6L18.4 166.6L100.4 206.6L176.4 168.6L192.4 110.6L180.4 46.6L96.4 4.6Z" stroke-width="2.5" stroke-linejoin="round" stroke="url(#fav_back_grad)" stroke-opacity="0.6"/>
    <g id="Back_Nodes">
      <circle cx="96.4" cy="4.6" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.8"/>
      <circle cx="14.4" cy="50.6" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.8"/>
      <circle cx="4.4" cy="108.6" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.8"/>
      <circle cx="18.4" cy="166.6" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.8"/>
      <circle cx="100.4" cy="206.6" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.8"/>
      <circle cx="176.4" cy="168.6" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.8"/>
      <circle cx="192.4" cy="110.6" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.8"/>
      <circle cx="180.4" cy="46.6" r="5" fill="#2563EB" stroke="#93C5FD" stroke-width="1.8"/>
    </g>
  </g>

  <!-- 2. Textured Resume Document -->
  <g id="Resume_Document" transform="translate(66, 36)">
    <!-- Base Paper Shape -->
    <path d="M5.5 0.5H88.5L108.5 20.5V159.5C108.5 162.261 106.261 164.5 103.5 164.5H5.5C2.7386 164.5 0.5 162.261 0.5 159.5V5.5C0.5 2.7386 2.7386 0.5 5.5 0.5Z" fill="url(#fav_paper_grad)" stroke="#94A3B8" stroke-width="1.5"/>

    <g clip-path="url(#fav_paper_clip)">
      <!-- Left Spine Accent -->
      <path d="M4 0H0V164H4V0Z" fill="#CBD5E1"/>

      <!-- Profile Avatar Block -->
      <rect x="12" y="14" width="22" height="22" rx="4" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="23" cy="22" r="4" fill="#64748B"/>
      <path d="M16 33C16 29 19 27 23 27C27 27 30 29 30 33" fill="#64748B"/>

      <!-- Header Lines -->
      <rect x="40" y="17" width="44" height="6" rx="3" fill="#0F172A"/>
      <rect x="40" y="27" width="30" height="4.5" rx="2.2" fill="#475569"/>

      <!-- Divider -->
      <line x1="12" y1="44" x2="96" y2="44" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Experience Block -->
      <rect x="12" y="52" width="46" height="5" rx="2.5" fill="#1E293B"/>
      <rect x="16" y="62" width="76" height="4" rx="2" fill="#64748B"/>

      <!-- Highlighted Skill Match Bar -->
      <rect x="13" y="72" width="82" height="11" rx="3" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1"/>
      <rect x="18" y="75.5" width="72" height="4" rx="2" fill="#1D4ED8"/>

      <!-- Second Section -->
      <rect x="12" y="93" width="40" height="5" rx="2.5" fill="#1E293B"/>
      <rect x="16" y="103" width="74" height="4" rx="2" fill="#64748B"/>

      <!-- Skills Pills -->
      <rect x="12" y="122" width="25" height="10" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="42" y="122" width="30" height="10" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="76" y="122" width="20" height="10" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>

      <!-- Dog-Ear Fold Shadow & Flap -->
      <path d="M88 20H108V26L88 20Z" fill="#0F172A" fill-opacity="0.15"/>
      <path d="M88 0V16C88 18.2 89.8 20 92 20H108L88 0Z" fill="url(#fav_fold_grad)"/>
    </g>
  </g>

  <!-- 3. Foreground Neural Mesh & Central Target -->
  <g id="Neural_Network_Overlap" transform="translate(26, 22)">
    <!-- Cyan Glow Halo -->
    <path d="M11.8 46.9L65.8 44.9M65.8 44.9L111.8 74.3M65.8 44.9L93.8 1.8M65.8 44.9L87.8 94.9M111.8 74.3L177.8 43M111.8 74.3L87.8 94.9M87.8 94.9L1.8 103.7M87.8 94.9L121.8 125.3M87.8 94.9L73.8 148.8M121.8 125.3L189.8 105.7M121.8 125.3L97.8 199.8L73.8 148.8M121.8 125.3L173.8 162.6M15.8 160.6L73.8 148.8" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sharp Gradient Line -->
    <path d="M11.8 46.9L65.8 44.9M65.8 44.9L111.8 74.3M65.8 44.9L93.8 1.8M65.8 44.9L87.8 94.9M111.8 74.3L177.8 43M111.8 74.3L87.8 94.9M87.8 94.9L1.8 103.7M87.8 94.9L121.8 125.3M87.8 94.9L73.8 148.8M121.8 125.3L189.8 105.7M121.8 125.3L97.8 199.8L73.8 148.8M121.8 125.3L173.8 162.6M15.8 160.6L73.8 148.8" stroke="url(#fav_fore_grad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Nodes -->
    <g transform="translate(65.8, 44.9)">
      <circle r="6" fill="#2563EB" stroke="#F8FAFC" stroke-width="2"/>
      <circle r="2.2" fill="#BAE6FD"/>
    </g>
    <g transform="translate(111.8, 74.3)">
      <circle r="6" fill="#2563EB" stroke="#F8FAFC" stroke-width="2"/>
      <circle r="2.2" fill="#BAE6FD"/>
    </g>
    <!-- Core Central Anchor -->
    <g transform="translate(87.8, 94.9)">
      <circle r="11" fill="#0284C7" fill-opacity="0.3"/>
      <circle r="7.5" fill="#1D4ED8" stroke="#F8FAFC" stroke-width="2.2"/>
      <circle r="3.2" fill="#E0F2FE"/>
    </g>
    <g transform="translate(121.8, 125.3)">
      <circle r="6" fill="#2563EB" stroke="#F8FAFC" stroke-width="2"/>
      <circle r="2.2" fill="#BAE6FD"/>
    </g>
    <g transform="translate(73.8, 148.8)">
      <circle r="6" fill="#2563EB" stroke="#F8FAFC" stroke-width="2"/>
      <circle r="2.2" fill="#BAE6FD"/>
    </g>
  </g>
</svg>