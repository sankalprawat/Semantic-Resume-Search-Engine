version: '3.8'

services:
  # PostgreSQL 16 with pgvector extension pre-installed
  db:
    image: pgvector/pgvector:pg16
    container_name: talent_engine_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talent_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talent_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
